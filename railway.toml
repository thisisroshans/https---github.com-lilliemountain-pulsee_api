# Railway deployment configuration.
#
# Railway runs the API container; Postgres lives on Neon and Redis on Upstash,
# so no database service is defined here — only outbound connection strings,
# which are set as environment variables in the Railway dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run before the new version receives traffic, so the schema is never
# behind the code. Invoked via the local binary rather than a package script
# because the production image has no package manager on PATH.
preDeployCommand = ["node_modules/.bin/prisma migrate deploy"]

# Readiness, not liveness: a release whose database or cache is misconfigured
# should fail its health check and roll back rather than serve broken traffic.
healthcheckPath = "/api/v1/health/ready"
healthcheckTimeout = 120

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Overlap old and new instances so deploys do not drop requests.
numReplicas = 1
